name: Auto-format badminton PR

on:
  push:
    branches:
      - feat/badminton-instant-score-sync-menu
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Format affected files
        run: |
          yarn prettier --write src/features/badminton/components/RealtimeBadmintonRoom.tsx src/features/badminton/lib/realtime-room.ts
      - name: Verify lint
        run: yarn lint
      - name: Commit formatted files
        run: |
          if ! git diff --quiet -- src/features/badminton/components/RealtimeBadmintonRoom.tsx src/features/badminton/lib/realtime-room.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/features/badminton/components/RealtimeBadmintonRoom.tsx src/features/badminton/lib/realtime-room.ts
            git commit -m "style(badminton): apply Prettier formatting"
            git push
          fi
