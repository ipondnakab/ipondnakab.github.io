name: Format badminton realtime code

on:
  push:
    branches: [fix/badminton-realtime-lint]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Apply Prettier to realtime files
        run: yarn prettier --write src/features/badminton/components/RealtimeBadmintonRoom.tsx src/features/badminton/lib/realtime-room.ts src/app/mini-project/badminton/live/page.tsx
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/badminton/components/RealtimeBadmintonRoom.tsx src/features/badminton/lib/realtime-room.ts src/app/mini-project/badminton/live/page.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(badminton): format realtime files"
            git push
          fi
